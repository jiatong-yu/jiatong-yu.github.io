<!DOCTYPE html>
<!--
  Blog post template.

  To add a post: copy this file to blogs/<slug>.html, create
  content/blog/<slug>.md, and add "- <slug>" to the Blogs section of
  content/home.md. The page loads the markdown file matching its own filename,
  so nothing in here needs editing.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="author" content="Jiatong Yu" />
        <title>Jiatong Yu</title>
        <link rel="icon" href="../assets/img/favicon.ico" />
        <meta name="theme-color" content="#1F3864" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Type is Book Antiqua / Palatino, resolved from the system; there is no webfont to load.-->
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="../css/styles.css" rel="stylesheet" />
        <link href="../css/aux.css" rel="stylesheet" />
        <link href="../css/blog.css" rel="stylesheet" />

        <script>
            MathJax = {
                tex: {
                    inlineMath: [['$', '$'], ['\\(', '\\)']],
                    macros: {
                        R: "\\mathbb{R}",
                        softmax: "\\operatorname{softmax}",
                        loss: "\\ell",
                        delequal: "\\triangleq",
                    }
                },
                svg: { fontCache: 'global' }
            };
        </script>
        <script type="text/javascript" id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
        </script>
    </head>
    <body id="page-top" data-page="post" data-base="../">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="topNav"></nav>
        <main id="content"></main>

        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Markdown parser + site renderer-->
        <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
        <script src="../js/site.js"></script>
    </body>
</html>
